<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Deposito - Apex Gestao</title>
<style>
:root{--bg:#0B1623;--card:#131F30;--card2:#1A2940;--accent:#3B82F6;--green:#10B981;--red:#EF4444;--orange:#F59E0B;--purple:#8B5CF6;--text:#E2E8F0;--muted:#64748B;--border:#1E3048}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,#0F2744,#1A3A5C);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.header h1{font-size:16px;color:#fff;letter-spacing:.5px}
.header .sub{font-size:10px;color:var(--muted);margin-top:2px}
.badge{font-size:9px;background:var(--accent);color:#fff;padding:2px 8px;border-radius:20px}
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border)}
.tabs button{flex:1;padding:12px 8px;border:none;background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
.content{padding:16px;max-width:600px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid var(--border)}
.card-title{font-size:13px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%}
.btn{padding:12px;border-radius:12px;border:none;color:#fff;font-weight:700;font-size:14px;cursor:pointer;width:100%}
.btn:active{opacity:.8}
.login-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:linear-gradient(180deg,#0B1623,#131F30)}
.login-box{background:var(--card);border-radius:20px;padding:32px;width:100%;max-width:320px;text-align:center;border:1px solid var(--border)}
.field{margin-bottom:10px}
.field label{font-size:11px;color:var(--muted);margin-bottom:4px;display:block;font-weight:600}
.field input,.field select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:#fff;font-size:14px;outline:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 24px;border-radius:12px;font-size:13px;font-weight:700;z-index:999;display:none;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.empty{text-align:center;padding:30px;color:var(--muted);font-size:12px}

/* Mic button */
.mic-wrap{display:flex;flex-direction:column;align-items:center;margin:20px 0}
.mic-btn{width:120px;height:120px;border-radius:50%;border:4px solid var(--accent);background:rgba(59,130,246,.1);display:flex;align-items:center;justify-content:center;font-size:48px;cursor:pointer;transition:all .3s;position:relative}
.mic-btn:active{transform:scale(.95)}
.mic-btn.recording{border-color:var(--red);background:rgba(239,68,68,.15);animation:pulse 1.5s infinite}
.mic-btn.recording::after{content:"";position:absolute;width:100%;height:100%;border-radius:50%;border:2px solid var(--red);animation:ring 1.5s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes ring{0%{transform:scale(1);opacity:1}100%{transform:scale(1.5);opacity:0}}
.mic-label{font-size:12px;color:var(--muted);margin-top:10px;font-weight:600}

/* Transcript */
.transcript{background:var(--card2);border-radius:12px;padding:14px;min-height:60px;font-size:14px;line-height:1.6;margin:12px 0;border:1px solid var(--border);white-space:pre-wrap}
.transcript.listening{border-color:var(--red)}
.transcript .interim{color:var(--muted);font-style:italic}

/* Item row */
.item-row{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);gap:10px}
.item-row:last-child{border:none}
.item-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.item-info{flex:1;min-width:0}
.item-name{font-size:12px;font-weight:600}
.item-detail{font-size:10px;color:var(--muted)}
.item-qty{text-align:right;min-width:55px}
.item-qty .num{font-size:16px;font-weight:800}
.item-qty .un{font-size:9px;color:var(--muted)}
.remove-btn{background:transparent;border:1px solid var(--red);color:var(--red);width:24px;height:24px;border-radius:6px;font-size:12px;cursor:pointer;flex-shrink:0}

/* Parsed items edit */
.parsed-item{display:grid;grid-template-columns:60px 1fr 40px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.parsed-item input{padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:#fff;font-size:13px;text-align:center}
.parsed-item .pname{font-size:12px;font-weight:600}

/* History card */
.hist-card{background:var(--card2);border-radius:12px;padding:12px;margin-bottom:8px;border:1px solid var(--border);cursor:pointer}
.hist-card .hdr{display:flex;justify-content:space-between;align-items:center}
.hist-card .hdr .who{font-size:12px;font-weight:700}
.hist-card .hdr .when{font-size:10px;color:var(--muted)}
.hist-card .cnt{font-size:11px;color:var(--accent);margin-top:4px}
.hist-detail{display:none;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
</style>
</head>

<div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyCakQu2hZkuA9lepyXPNs9ldydwEcHVPeQ",authDomain:"caixa-restaurante.firebaseapp.com",projectId:"caixa-restaurante",storageBucket:"caixa-restaurante.firebasestorage.app",messagingSenderId:"161559449251",appId:"1:161559449251:web:e10ef70290a7ef2e7db916"});
var db=firebase.firestore(),px="emp_dona-maria-_",
USR="",AB="registro",PRODS=[],TRANSFS=[],
PARSED=[],RAWTXT="",LISTENING=false,REC=null;

var NUMS={"um":1,"uma":1,"dois":2,"duas":2,"tres":3,"três":3,"quatro":4,"cinco":5,"seis":6,"sete":7,"oito":8,"nove":9,"dez":10,"onze":11,"doze":12,"treze":13,"quatorze":14,"catorze":14,"quinze":15,"dezesseis":16,"dezessete":17,"dezoito":18,"dezenove":19,"vinte":20,"trinta":30,"quarenta":40,"cinquenta":50,"meio":0.5,"meia":0.5};
var CATS_IC={"Proteina":"🥩","Hortifruti":"🥬","Bebida":"🍺","Insumo":"🧂","Embalagem":"📦","Limpeza":"🧹"};

function toast(m){var t=document.getElementById("toast");t.textContent=m;t.style.display="block";setTimeout(function(){t.style.display="none"},2500)}

function login(){
  var s=document.getElementById("sn").value.trim();
  var n=document.getElementById("nm").value.trim();
  if(!n)return alert("Digite seu nome!");
  if(s==="93051301"||s==="1234"){USR=n}else return alert("Senha incorreta!");
  document.getElementById("app").innerHTML='<div style="text-align:center;padding:40px;color:var(--muted)">Carregando...</div>';
  Promise.all([
    db.collection(px+"estoque_produtos").get(),
    db.collection(px+"deposito_transfs").orderBy("data","desc").limit(100).get()
  ]).then(function(rs){
    PRODS=[];rs[0].forEach(function(d){PRODS.push(d.data())});
    TRANSFS=[];rs[1].forEach(function(d){TRANSFS.push(d.data())});
    PRODS.sort(function(a,b){return(a.nome||"").localeCompare(b.nome||"")});
    render();
  }).catch(function(e){console.error(e);render()});
}

function render(){
  var h='<div class="header"><div><h1>Deposito → Loja</h1><div class="sub">Dona Maria Express</div></div><div style="display:flex;align-items:center;gap:8px"><span class="badge">'+USR+'</span><button onclick="location.reload()" style="padding:4px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;font-size:10px;cursor:pointer">Sair</button></div></div>';
  h+='<div class="tabs"><button class="'+(AB==="registro"?"active":"")+'" onclick="AB=\'registro\';render()">📦 Registrar</button><button class="'+(AB==="historico"?"active":"")+'" onclick="AB=\'historico\';render()">📋 Historico</button></div>';
  h+='<div class="content">';
  if(AB==="registro")h+=pgRegistro();
  else h+=pgHistorico();
  h+='</div>';
  document.getElementById("app").innerHTML=h;
}

function pgRegistro(){
  var h='<div class="card"><div class="card-title"><div class="dot" style="background:var(--accent)"></div>Transferencia Deposito → Loja</div>';
  h+='<p style="font-size:11px;color:var(--muted);margin-bottom:16px">Toque no microfone e fale os itens que esta levando. Ex: "dois oleos, cinco contrafile, uma esponja"</p>';

  // Mic button
  h+='<div class="mic-wrap"><div class="mic-btn'+(LISTENING?" recording":"")+'" onclick="toggleMic()" id="micBtn">'+(LISTENING?"⏹️":"🎤")+'</div>';
  h+='<div class="mic-label">'+(LISTENING?"Ouvindo... toque para parar":"Toque para falar")+'</div></div>';

  // Transcript
  if(RAWTXT||LISTENING){
    h+='<div class="transcript'+(LISTENING?" listening":"")+'" id="transcriptBox">'+(RAWTXT||'<span class="interim">Aguardando fala...</span>')+'</div>';
  }

  // Manual add option
  h+='<div style="margin:12px 0;text-align:center"><button onclick="mostrarManual()" style="padding:6px 16px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;cursor:pointer">✏️ Ou adicionar manualmente</button></div>';
  h+='<div id="manualAdd" style="display:none"></div>';

  h+='</div>';

  // Parsed items
  if(PARSED.length){
    h+='<div class="card" style="border-color:var(--green)"><div class="card-title"><div class="dot" style="background:var(--green)"></div>Itens Reconhecidos ('+PARSED.length+')</div>';
    h+='<p style="font-size:10px;color:var(--muted);margin-bottom:10px">Confira e ajuste as quantidades antes de salvar.</p>';
    PARSED.forEach(function(it,i){
      var ic=CATS_IC[it.categoria]||"📋";
      h+='<div class="parsed-item"><input type="number" step="0.5" value="'+it.qtd+'" id="pq-'+i+'" onchange="PARSED['+i+'].qtd=parseFloat(this.value)||0" style="font-weight:700;font-size:15px"><div><div class="pname">'+ic+' '+it.nome+'</div><div style="font-size:10px;color:var(--muted)">'+it.unidade+'</div></div><button class="remove-btn" onclick="PARSED.splice('+i+',1);render()">✕</button></div>';
    });
    h+='<div style="margin-top:14px;display:flex;gap:8px"><button onclick="salvarTransf()" class="btn" style="background:linear-gradient(135deg,#059669,#10B981)">✅ Salvar Transferencia</button></div>';
    h+='<button onclick="PARSED=[];RAWTXT=\'\';render()" class="btn" style="background:#64748B;margin-top:6px;font-size:12px">Limpar Tudo</button>';
    h+='</div>';
  }

  return h;
}

function pgHistorico(){
  var h='<div class="card"><div class="card-title"><div class="dot" style="background:var(--purple)"></div>Historico de Transferencias</div>';
  if(!TRANSFS.length){h+='<div class="empty">Nenhuma transferencia registrada.</div></div>';return h}

  // Agrupar por data
  var porDia={};
  TRANSFS.forEach(function(t){
    var dia=t.data.substring(0,10);
    if(!porDia[dia])porDia[dia]=[];
    porDia[dia].push(t);
  });

  var dias=Object.keys(porDia).sort().reverse();
  dias.forEach(function(dia){
    var ts=porDia[dia];
    h+='<div style="margin-bottom:16px"><div style="font-size:11px;font-weight:700;color:var(--accent);margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--border)">'+dia.split("-").reverse().join("/")+'</div>';
    ts.forEach(function(t,idx){
      var uid="ht-"+dia.replace(/-/g,"")+"-"+idx;
      h+='<div class="hist-card" onclick="toggleHist(\''+uid+'\')"><div class="hdr"><div class="who">👤 '+t.responsavel+'</div><div class="when">'+t.data.substring(11,16)+'</div></div>';
      h+='<div class="cnt">'+t.itens.length+' ite'+(t.itens.length>1?"ns":"m")+'</div>';
      h+='<div class="hist-detail" id="'+uid+'">';
      t.itens.forEach(function(it){
        h+='<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:11px"><span>'+(CATS_IC[it.categoria]||"📋")+' '+it.nome+'</span><span style="font-weight:700;color:var(--orange)">'+it.qtd+' '+it.unidade+'</span></div>';
      });
      if(t.textoOriginal){
        h+='<div style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border);font-size:10px;color:var(--muted);font-style:italic">"'+t.textoOriginal+'"</div>';
      }
      h+='</div></div>';
    });
    h+='</div>';
  });
  h+='</div>';
  return h;
}

function toggleHist(id){var el=document.getElementById(id);if(el)el.style.display=el.style.display==="none"?"block":"none"}

// ==================== SPEECH RECOGNITION ====================

function toggleMic(){
  if(LISTENING){stopMic();return}
  if(!("webkitSpeechRecognition" in window)&&!("SpeechRecognition" in window)){
    alert("Navegador nao suporta reconhecimento de voz. Use o Chrome.");return;
  }
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  REC=new SR();
  REC.lang="pt-BR";
  REC.continuous=true;
  REC.interimResults=true;
  REC.maxAlternatives=1;

  var finalTxt=RAWTXT||"";

  REC.onresult=function(e){
    var interim="";
    for(var i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal){
        var txt=e.results[i][0].transcript.trim();
        if(finalTxt)finalTxt+=", ";
        finalTxt+=txt;
      }else{
        interim+=e.results[i][0].transcript;
      }
    }
    RAWTXT=finalTxt;
    var box=document.getElementById("transcriptBox");
    if(box){
      box.innerHTML=finalTxt+(interim?' <span class="interim">'+interim+'</span>':"");
    }
  };

  REC.onerror=function(e){
    console.error("Speech error:",e.error);
    if(e.error==="not-allowed"){alert("Permita o microfone nas configuracoes do navegador.");stopMic()}
  };

  REC.onend=function(){
    if(LISTENING){
      // Auto-restart if still supposed to be listening
      try{REC.start()}catch(e){stopMic()}
    }
  };

  LISTENING=true;
  try{REC.start()}catch(e){alert("Erro ao iniciar microfone.");LISTENING=false}
  render();
}

function stopMic(){
  LISTENING=false;
  if(REC){try{REC.stop()}catch(e){}}
  REC=null;
  // Parse the text
  if(RAWTXT){
    parseVoz(RAWTXT);
  }
  render();
}

// ==================== PARSE VOICE TEXT ====================

function parseVoz(txt){
  // Normalize
  var t=txt.toLowerCase()
    .replace(/[.!?;]/g,",")
    .replace(/\s+/g," ")
    .trim();

  // Split by comma or "e" between items
  var partes=t.split(/[,]+/).map(function(s){return s.trim()}).filter(function(s){return s});

  var novos=[];
  partes.forEach(function(parte){
    // Try to extract quantity + product name
    var result=extrairItem(parte);
    if(result){
      // Check if already in PARSED
      var existe=PARSED.findIndex(function(p){return p.produtoId===result.produtoId});
      if(existe>=0){
        PARSED[existe].qtd+=result.qtd;
      }else{
        novos.push(result);
      }
    }
  });
  PARSED=PARSED.concat(novos);
}

function extrairItem(texto){
  var words=texto.trim().split(/\s+/);
  var qtd=0;
  var nameStart=0;

  // Try to find leading number (digit or word)
  if(words.length>=1){
    var first=words[0];
    // Check if it's a digit number
    var num=parseFloat(first.replace(",","."));
    if(!isNaN(num)&&num>0){
      qtd=num;
      nameStart=1;
    }else if(NUMS[first]!==undefined){
      qtd=NUMS[first];
      nameStart=1;
      // Check for compound: "vinte e cinco"
      if(words.length>=3&&words[1]==="e"&&NUMS[words[2]]!==undefined){
        qtd+=NUMS[words[2]];
        nameStart=3;
      }
    }
  }

  if(qtd===0)qtd=1; // default 1 if no number spoken

  var nomeFalado=words.slice(nameStart).join(" ").trim();
  if(!nomeFalado)return null;

  // Remove articles and prepositions
  nomeFalado=nomeFalado.replace(/^(de |do |da |dos |das |o |a |os |as |um |uma |uns |umas )/,"").trim();

  // Try to match against registered products
  var melhor=null,melhorScore=0;
  PRODS.forEach(function(p){
    var score=similaridade(nomeFalado,p.nome.toLowerCase());
    if(score>melhorScore){
      melhorScore=score;
      melhor=p;
    }
  });

  // If good match found
  if(melhor&&melhorScore>=0.4){
    return{produtoId:melhor.id,nome:melhor.nome,categoria:melhor.categoria,unidade:melhor.unidade,qtd:qtd};
  }

  // Partial match - check if spoken name is contained in any product
  var parcial=null;
  PRODS.forEach(function(p){
    var pn=p.nome.toLowerCase();
    if(pn.indexOf(nomeFalado)>=0||nomeFalado.indexOf(pn)>=0){
      if(!parcial||(p.nome.length<parcial.nome.length)){
        parcial=p;
      }
    }
  });

  if(parcial){
    return{produtoId:parcial.id,nome:parcial.nome,categoria:parcial.categoria,unidade:parcial.unidade,qtd:qtd};
  }

  // No match - add as unregistered item
  return{produtoId:"manual-"+Date.now()+"-"+Math.random().toString(36).substr(2,4),nome:capitalizar(nomeFalado),categoria:"",unidade:"un",qtd:qtd};
}

function similaridade(a,b){
  // Simple similarity: longest common subsequence ratio
  a=a.replace(/[áàãâ]/g,"a").replace(/[éèê]/g,"e").replace(/[íìî]/g,"i").replace(/[óòõô]/g,"o").replace(/[úùû]/g,"u").replace(/ç/g,"c");
  b=b.replace(/[áàãâ]/g,"a").replace(/[éèê]/g,"e").replace(/[íìî]/g,"i").replace(/[óòõô]/g,"o").replace(/[úùû]/g,"u").replace(/ç/g,"c");
  if(a===b)return 1;
  // Check containment
  if(b.indexOf(a)>=0)return 0.8;
  if(a.indexOf(b)>=0)return 0.7;
  // Word overlap
  var wa=a.split(/\s+/),wb=b.split(/\s+/);
  var match=0;
  wa.forEach(function(w){if(wb.indexOf(w)>=0)match++});
  if(wa.length>0)return match/Math.max(wa.length,wb.length);
  return 0;
}

function capitalizar(s){return s.charAt(0).toUpperCase()+s.slice(1)}

// ==================== MANUAL ADD ====================

function mostrarManual(){
  var el=document.getElementById("manualAdd");
  if(!el)return;
  if(el.style.display==="block"){el.style.display="none";return}
  var h='<div class="card" style="border-color:var(--accent)"><div style="font-size:12px;font-weight:700;margin-bottom:10px">Adicionar Manual</div>';
  h+='<div class="field"><label>Produto</label><select id="manProd"><option value="">Selecione</option>';
  PRODS.forEach(function(p){h+='<option value="'+p.id+'">'+p.nome+' ('+p.unidade+')</option>'});
  h+='</select></div>';
  h+='<div class="field"><label>Quantidade</label><input type="number" step="0.5" id="manQtd" value="1" inputmode="decimal"></div>';
  h+='<button onclick="addManual()" class="btn" style="background:var(--accent);margin-top:4px;font-size:13px">+ Adicionar</button></div>';
  el.innerHTML=h;
  el.style.display="block";
}

function addManual(){
  var pid=document.getElementById("manProd").value;
  var qtd=parseFloat(document.getElementById("manQtd").value)||1;
  if(!pid)return alert("Selecione um produto!");
  var p=PRODS.find(function(x){return x.id===pid});
  if(!p)return;
  // Check if already in PARSED
  var existe=PARSED.findIndex(function(x){return x.produtoId===pid});
  if(existe>=0){PARSED[existe].qtd+=qtd}
  else{PARSED.push({produtoId:p.id,nome:p.nome,categoria:p.categoria,unidade:p.unidade,qtd:qtd})}
  toast("+"+qtd+" "+p.unidade+" "+p.nome);
  render();
}

// ==================== SAVE TRANSFER ====================

function salvarTransf(){
  if(!PARSED.length)return;
  if(!confirm("Confirmar transferencia de "+PARSED.length+" ite"+(PARSED.length>1?"ns":"m")+" do deposito para a loja?"))return;

  var id="tf-"+Date.now();
  var reg={
    id:id,
    responsavel:USR,
    data:new Date().toISOString(),
    textoOriginal:RAWTXT||"",
    itens:PARSED.map(function(it){return{produtoId:it.produtoId,nome:it.nome,categoria:it.categoria||"",unidade:it.unidade,qtd:it.qtd}})
  };

  db.collection(px+"deposito_transfs").doc(id).set(reg).then(function(){
    // Also register as estoque movements (saida do deposito = type transferencia)
    PARSED.forEach(function(it,i){
      var mv={
        id:"mv-tf-"+Date.now()+"-"+i,
        tipo:"transferencia",
        produtoId:it.produtoId,
        produto:it.nome,
        qtd:it.qtd,
        unidade:it.unidade,
        motivo:"Deposito → Loja",
        obs:"Responsavel: "+USR,
        data:new Date().toISOString(),
        usuario:USR
      };
      db.collection(px+"estoque_movs").doc(mv.id).set(mv);
    });

    TRANSFS.unshift(reg);
    toast("Transferencia salva! "+PARSED.length+" itens");
    PARSED=[];
    RAWTXT="";
    render();
  }).catch(function(e){
    console.error(e);
    alert("Erro ao salvar. Tente novamente.");
  });
}
