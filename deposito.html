<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Deposito - Dona Maria Express</title>
<style>
:root{--bg:#0B1623;--card:#131F30;--card2:#1A2940;--accent:#3B82F6;--green:#10B981;--red:#EF4444;--orange:#F59E0B;--purple:#8B5CF6;--text:#E2E8F0;--muted:#64748B;--border:#1E3048}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,#0F2744,#1A3A5C);padding:16px 20px;text-align:center;border-bottom:1px solid var(--border)}
.header h1{font-size:18px;color:#fff;letter-spacing:.5px}
.header .sub{font-size:11px;color:var(--muted);margin-top:2px}
.content{padding:16px;max-width:600px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid var(--border)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:12px 28px;border-radius:12px;font-size:14px;font-weight:700;z-index:999;display:none;box-shadow:0 4px 20px rgba(0,0,0,.3)}

/* Big mic button */
.mic-area{display:flex;flex-direction:column;align-items:center;padding:30px 0}
.mic-btn{width:140px;height:140px;border-radius:50%;border:5px solid var(--accent);background:rgba(59,130,246,.1);display:flex;align-items:center;justify-content:center;font-size:56px;cursor:pointer;transition:all .3s;position:relative;-webkit-tap-highlight-color:transparent;user-select:none}
.mic-btn:active{transform:scale(.95)}
.mic-btn.recording{border-color:var(--red);background:rgba(239,68,68,.15);animation:pulse 1.5s infinite}
.mic-btn.recording::after{content:"";position:absolute;width:100%;height:100%;border-radius:50%;border:3px solid var(--red);animation:ring 1.5s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes ring{0%{transform:scale(1);opacity:1}100%{transform:scale(1.6);opacity:0}}
.mic-label{font-size:14px;color:var(--muted);margin-top:14px;font-weight:600;text-align:center}
.mic-label.rec{color:var(--red);font-size:16px}
.mic-hint{font-size:11px;color:var(--muted);margin-top:8px;text-align:center;max-width:280px;line-height:1.5}

/* Transcript live */
.transcript{background:var(--card2);border-radius:12px;padding:14px;min-height:50px;font-size:15px;line-height:1.7;margin:16px 0;border:2px solid var(--border);white-space:pre-wrap}
.transcript.listening{border-color:var(--red);background:rgba(239,68,68,.05)}
.transcript .interim{color:var(--muted);font-style:italic}

/* Saved confirmation */
.saved-box{background:rgba(16,185,129,.1);border:2px solid var(--green);border-radius:16px;padding:20px;text-align:center;margin:16px 0}
.saved-box .check{font-size:48px;margin-bottom:8px}
.saved-box .msg{font-size:14px;font-weight:700;color:var(--green)}
.saved-box .det{font-size:12px;color:var(--muted);margin-top:6px}

/* History */
.dia-header{font-size:12px;font-weight:700;color:var(--accent);margin:16px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.entry{background:var(--card2);border-radius:12px;padding:12px;margin-bottom:8px;border:1px solid var(--border)}
.entry .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.entry .hora{font-size:13px;font-weight:800;color:var(--orange)}
.entry .nome{font-size:12px;font-weight:600;color:var(--accent)}
.entry .fala{font-size:13px;line-height:1.6;color:var(--text)}
.empty{text-align:center;padding:30px;color:var(--muted);font-size:13px}

.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border)}
.tabs button{flex:1;padding:12px 8px;border:none;background:transparent;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}

/* Calendar */
.cal{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid var(--border)}
.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-nav .mes{font-size:15px;font-weight:700;text-transform:capitalize}
.cal-nav button{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:#fff;font-size:16px;cursor:pointer}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-grid .dw{font-size:9px;color:var(--muted);font-weight:700;padding:4px 0;text-transform:uppercase}
.cal-grid .day{padding:8px 2px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:all .2s}
.cal-grid .day:hover{background:var(--card2)}
.cal-grid .day.empty{cursor:default}
.cal-grid .day.hoje{border-color:var(--accent);color:var(--accent)}
.cal-grid .day.sel{background:var(--accent);color:#fff}
.cal-grid .day.tem{position:relative}
.cal-grid .day.tem::after{content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--orange)}

/* Admin login overlay */
.admin-login{background:var(--card);border-radius:16px;padding:24px;margin:20px 0;text-align:center;border:1px solid var(--border)}
.admin-login input{padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:#fff;font-size:16px;text-align:center;width:160px;outline:none}

/* Resumo dia */
.resumo{background:linear-gradient(135deg,rgba(59,130,246,.1),rgba(139,92,246,.1));border:1px solid var(--accent);border-radius:14px;padding:14px;margin-bottom:12px}
.resumo .tit{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:4px}
.resumo .sub{font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyCakQu2hZkuA9lepyXPNs9ldydwEcHVPeQ",authDomain:"caixa-restaurante.firebaseapp.com",projectId:"caixa-restaurante",storageBucket:"caixa-restaurante.firebasestorage.app",messagingSenderId:"161559449251",appId:"1:161559449251:web:e10ef70290a7ef2e7db916"});
var db=firebase.firestore(),px="emp_dona-maria-_",
AB="registro",TRANSFS=[],LISTENING=false,REC=null,RAWTXT="",SAVED=false,
ADMIN=false,CAL_MES=new Date().getMonth(),CAL_ANO=new Date().getFullYear(),SEL_DIA="";

function toast(m){var t=document.getElementById("toast");t.textContent=m;t.style.display="block";setTimeout(function(){t.style.display="none"},3000)}

function carregar(){
  db.collection(px+"deposito_transfs").orderBy("data","desc").limit(200).get().then(function(snap){
    TRANSFS=[];snap.forEach(function(d){TRANSFS.push(d.data())});
    render();
  }).catch(function(){render()});
}

function render(){
  var h='<div class="header"><h1>📦 Deposito → Loja</h1><div class="sub">Dona Maria Express</div></div>';
  h+='<div class="tabs"><button class="'+(AB==="registro"?"active":"")+'" onclick="AB=\'registro\';SAVED=false;render()">🎤 Registrar</button><button class="'+(AB==="admin"?"active":"")+'" onclick="AB=\'admin\';render()">🔒 Admin</button></div>';
  h+='<div class="content">';
  if(AB==="registro")h+=pgRegistro();
  else if(AB==="admin")h+=pgAdmin();
  h+='</div>';
  document.getElementById("app").innerHTML=h;
}

function pgRegistro(){
  var h="";

  if(SAVED){
    h+='<div class="saved-box"><div class="check">✅</div><div class="msg">Registrado com sucesso!</div><div class="det">Toque no microfone para novo registro</div></div>';
  }

  h+='<div class="card"><div class="mic-area">';
  h+='<div class="mic-btn'+(LISTENING?" recording":"")+'" onclick="toggleMic()" id="micBtn">'+(LISTENING?"⏹️":"🎤")+'</div>';
  if(LISTENING){
    h+='<div class="mic-label rec">🔴 Gravando... toque para parar</div>';
  }else{
    h+='<div class="mic-label">Toque para falar</div>';
    h+='<div class="mic-hint">Fale seu nome e o que esta pegando.<br>Ex: "Maria, pegando 6 parmegiana, 3 detergente, 1 arroz"</div>';
  }
  h+='</div>';

  if(RAWTXT||LISTENING){
    h+='<div class="transcript'+(LISTENING?" listening":"")+'" id="transcriptBox">'+(RAWTXT||'<span class="interim">Aguardando fala...</span>')+'</div>';
  }

  if(RAWTXT&&!LISTENING){
    h+='<div style="display:flex;gap:8px;margin-top:8px"><button onclick="salvarRegistro()" style="flex:1;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#059669,#10B981);color:#fff;font-weight:700;font-size:15px;cursor:pointer">✅ Salvar</button>';
    h+='<button onclick="RAWTXT=\'\';render()" style="padding:14px 18px;border-radius:12px;border:1px solid var(--red);background:transparent;color:var(--red);font-weight:700;font-size:13px;cursor:pointer">🗑️</button></div>';
  }

  h+='</div>';

  // Registros de hoje
  var hoje=new Date().toISOString().substring(0,10);
  var hojeTs=TRANSFS.filter(function(t){return t.data.substring(0,10)===hoje});
  if(hojeTs.length){
    h+='<div class="card" style="border-color:var(--accent)"><div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:10px">📋 Hoje — '+hojeTs.length+' registro'+(hojeTs.length>1?"s":"")+'</div>';
    hojeTs.forEach(function(t){
      h+=renderEntry(t);
    });
    h+='</div>';
  }

  return h;
}

function pgAdmin(){
  if(!ADMIN){
    var h='<div class="admin-login"><div style="font-size:36px;margin-bottom:12px">🔐</div>';
    h+='<div style="font-size:14px;font-weight:700;margin-bottom:4px">Area do Administrador</div>';
    h+='<div style="font-size:11px;color:var(--muted);margin-bottom:16px">Digite a senha para acessar</div>';
    h+='<input type="password" id="admSenha" inputmode="numeric" placeholder="Senha" onkeydown="if(event.key===\'Enter\')loginAdmin()"><br>';
    h+='<button onclick="loginAdmin()" style="margin-top:12px;padding:10px 32px;border-radius:10px;border:none;background:linear-gradient(135deg,#2563EB,#3B82F6);color:#fff;font-weight:700;font-size:14px;cursor:pointer">Entrar</button></div>';
    return h;
  }

  var h='';

  // Calendario
  h+=renderCalendario();

  // Registros do dia selecionado
  if(SEL_DIA){
    var diaTs=TRANSFS.filter(function(t){return t.data.substring(0,10)===SEL_DIA});
    var diaFmt=SEL_DIA.split("-").reverse().join("/");

    h+='<div class="resumo"><div class="tit">📅 '+diaFmt+'</div><div class="sub">'+diaTs.length+' registro'+(diaTs.length>1?"s":"")+'</div></div>';

    if(diaTs.length){
      diaTs.sort(function(a,b){return a.data.localeCompare(b.data)});
      diaTs.forEach(function(t){h+=renderEntry(t)});
    }else{
      h+='<div class="empty">Nenhum registro nesse dia.</div>';
    }
  }else{
    h+='<div class="empty">Selecione um dia no calendario.</div>';
  }

  return h;
}

function loginAdmin(){
  var s=document.getElementById("admSenha").value;
  if(s==="93051301"){ADMIN=true;SEL_DIA=new Date().toISOString().substring(0,10);render()}
  else{alert("Senha incorreta!")}
}

function renderCalendario(){
  var MESES=["Janeiro","Fevereiro","Marco","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  var DIAS_SEM=["Dom","Seg","Ter","Qua","Qui","Sex","Sab"];

  // Dias com registro no mes
  var diasComReg={};
  TRANSFS.forEach(function(t){
    var d=t.data.substring(0,10);
    var parts=d.split("-");
    if(parseInt(parts[0])===CAL_ANO&&parseInt(parts[1])===(CAL_MES+1)){
      diasComReg[parseInt(parts[2])]=true;
    }
  });

  var hoje=new Date();var hojeDia=hoje.getDate(),hojeMes=hoje.getMonth(),hojeAno=hoje.getFullYear();

  var h='<div class="cal"><div class="cal-nav">';
  h+='<button onclick="mudaMes(-1)">◀</button>';
  h+='<div class="mes">'+MESES[CAL_MES]+' '+CAL_ANO+'</div>';
  h+='<button onclick="mudaMes(1)">▶</button></div>';

  h+='<div class="cal-grid">';
  DIAS_SEM.forEach(function(d){h+='<div class="dw">'+d+'</div>'});

  // Primeiro dia do mes
  var primDia=new Date(CAL_ANO,CAL_MES,1).getDay();
  var totalDias=new Date(CAL_ANO,CAL_MES+1,0).getDate();

  for(var i=0;i<primDia;i++){h+='<div class="day empty"></div>'}

  for(var d=1;d<=totalDias;d++){
    var iso=CAL_ANO+"-"+String(CAL_MES+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    var cls="day";
    if(d===hojeDia&&CAL_MES===hojeMes&&CAL_ANO===hojeAno)cls+=" hoje";
    if(iso===SEL_DIA)cls+=" sel";
    if(diasComReg[d])cls+=" tem";
    h+='<div class="'+cls+'" onclick="selecionaDia(\''+iso+'\')">'+d+'</div>';
  }
  h+='</div></div>';
  return h;
}

function mudaMes(dir){
  CAL_MES+=dir;
  if(CAL_MES>11){CAL_MES=0;CAL_ANO++}
  if(CAL_MES<0){CAL_MES=11;CAL_ANO--}
  SEL_DIA="";
  render();
}

function selecionaDia(iso){SEL_DIA=iso;render()}

function renderEntry(t){
  var hora=t.data.substring(11,16);
  var h='<div class="entry"><div class="top"><div class="hora">🕐 '+hora+'</div>';
  if(t.responsavel)h+='<div class="nome">👤 '+t.responsavel+'</div>';
  h+='</div><div class="fala">'+escapeHtml(t.texto)+'</div></div>';
  return h;
}

function escapeHtml(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

// ==================== SPEECH ====================

var _PARTS=[];
var _STOPPING=false;

function toggleMic(){
  if(LISTENING){stopMic();return}
  if(!("webkitSpeechRecognition" in window)&&!("SpeechRecognition" in window)){
    alert("Navegador nao suporta reconhecimento de voz. Use o Chrome.");return;
  }
  SAVED=false;
  _PARTS=[];
  _STOPPING=false;
  LISTENING=true;
  iniciarSessao();
  render();
}

function iniciarSessao(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  REC=new SR();
  REC.lang="pt-BR";
  REC.continuous=true;
  REC.interimResults=true;

  var sessaoTexto="";

  REC.onresult=function(e){
    var final_="",interim="";
    for(var i=0;i<e.results.length;i++){
      if(e.results[i].isFinal){
        final_+=e.results[i][0].transcript;
      }else{
        interim+=e.results[i][0].transcript;
      }
    }
    sessaoTexto=final_.trim();
    RAWTXT=montarTexto(sessaoTexto);
    var box=document.getElementById("transcriptBox");
    if(box){
      box.innerHTML=escapeHtml(RAWTXT)+(interim?' <span class="interim"> '+escapeHtml(interim)+'</span>':"");
    }
  };

  REC.onerror=function(e){
    if(e.error==="not-allowed"){alert("Permita o microfone nas configuracoes do navegador.");_STOPPING=true;stopMic();return}
    // Outros erros (network, etc) - deixa o onend reiniciar
  };

  REC.onend=function(){
    // Salva o que essa sessao capturou
    if(sessaoTexto)_PARTS.push(sessaoTexto);
    RAWTXT=montarTexto("");
    REC=null;

    // Se o usuario NAO pediu pra parar, reinicia automaticamente
    if(LISTENING&&!_STOPPING){
      setTimeout(function(){
        if(LISTENING&&!_STOPPING){iniciarSessao()}
      },300);
    }else{
      LISTENING=false;
      render();
    }
  };

  try{REC.start()}catch(e){
    if(LISTENING&&!_STOPPING){
      setTimeout(function(){if(LISTENING&&!_STOPPING)iniciarSessao()},500);
    }
  }
}

function montarTexto(atual){
  var partes=_PARTS.slice();
  if(atual)partes.push(atual);
  return partes.join(", ");
}

function stopMic(){
  _STOPPING=true;
  LISTENING=false;
  if(REC){try{REC.stop()}catch(e){}}
  REC=null;
  RAWTXT=montarTexto("");
  render();
}

// ==================== SAVE ====================

function salvarRegistro(){
  if(!RAWTXT.trim())return;

  // Try to extract name from beginning
  var nome=extrairNome(RAWTXT);

  var id="tf-"+Date.now();
  var reg={
    id:id,
    responsavel:nome,
    texto:RAWTXT.trim(),
    data:new Date().toISOString()
  };

  db.collection(px+"deposito_transfs").doc(id).set(reg).then(function(){
    TRANSFS.unshift(reg);
    RAWTXT="";
    _PARTS=[];
    SAVED=true;
    toast("Registro salvo!");
    render();
  }).catch(function(e){
    console.error(e);
    alert("Erro ao salvar. Tente novamente.");
  });
}

function extrairNome(txt){
  var t=txt.trim();
  var match;

  // "Nome estou pegando" / "Nome to pegando" / "Nome pegando" / "Nome peguei"
  match=t.match(/^([a-zA-ZÀ-ÿ]+)[,.\s]+(?:estou|tô|to|vou|pegando|peguei|tirando|tirei|levando|levei|retirando|retirei)/i);
  if(match)return capitalizar(match[1]);

  // "Sou o/a Nome" / "Aqui é o/a Nome" / "Aqui Nome"
  match=t.match(/(?:sou|aqui\s*[eé]?)\s*(?:o|a)?\s*([a-zA-ZÀ-ÿ]+)/i);
  if(match&&match[1].length>2)return capitalizar(match[1]);

  // "Nome, 6 pacotes..." (nome seguido de virgula/ponto e numero)
  match=t.match(/^([a-zA-ZÀ-ÿ]+)[,.\s]+\d/i);
  if(match&&match[1].length>2)return capitalizar(match[1]);

  // Primeiro nome antes de virgula ou ponto
  match=t.match(/^([a-zA-ZÀ-ÿ]+)\s*[,.]/i);
  if(match&&match[1].length>2)return capitalizar(match[1]);

  // Primeira palavra se tem mais de 2 letras e nao eh artigo/preposicao
  var skip=["estou","pegando","peguei","tirando","levando","vou","um","uma","dois","duas","tres","quatro","cinco","seis","sete","oito","nove","dez","pacote","pacotes","caixa","caixas","de","do","da","no","na","para","com","que","por"];
  var palavras=t.split(/[\s,.]+/);
  if(palavras.length>0&&palavras[0].length>2&&skip.indexOf(palavras[0].toLowerCase())<0){
    return capitalizar(palavras[0]);
  }

  return "";
}

function capitalizar(s){return s.charAt(0).toUpperCase()+s.slice(1).toLowerCase()}

// ==================== INIT ====================
carregar();
</script>
</body>
</html>
